name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  policy-and-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: pip install httpx==0.28.1 fastapi==0.115.12
      - run: python -m unittest discover -s tests -p test_service.py -v
      - run: python -m py_compile service.py steering.py modal_model.py modal_app.py client.py cloud_dashboard.py evals/run.py
  steering-tensors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==5.17.0 scikit-learn==1.7.2
      # Upstream declares transformers<5. This is a tested, narrow compatibility override.
      - run: pip install steering-vectors==0.12.2 --no-deps
      - run: python -m unittest discover -s tests -p test_steering.py -v
